<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bellhaven — Review</title>
<style>
:root{color-scheme:light;--ink:#212121;--muted:#888;--line:#e8e8e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 13px;white-space:nowrap}button:hover{background:#f3f3f3}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #aaa;outline-offset:2px}svg{width:18px;height:18px;vertical-align:middle;flex:none}a{color:inherit;text-underline-offset:3px}.app{display:grid;grid-template-columns:278px minmax(0,1fr);height:100dvh;overflow:hidden}aside{background:#f9f9f9;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{height:70px;padding:21px 21px;display:flex;align-items:center;gap:10px;font-weight:550;font-size:17px;letter-spacing:-.5px}.brand svg{width:25px;height:25px}.workspace{font-size:10px;border:1px solid #ddd;padding:3px 6px;border-radius:5px;color:#888;font-weight:400;margin-left:auto;letter-spacing:0}.queue-head{padding:17px 15px 12px}.queue-title{display:flex;align-items:center;justify-content:space-between;padding:0 7px;margin-bottom:14px;font-weight:500;font-size:13px}.count{background:#eaeaea;border-radius:5px;padding:2px 7px;font-size:11px;color:#666}.search{position:relative}.search svg{position:absolute;left:11px;top:10px;width:15px;color:#888}.search input{width:100%;border:1px solid #e1e1e1;border-radius:8px;background:transparent;padding:9px 10px 9px 34px;font-size:12px}.filters{display:flex;gap:3px;padding-top:14px}.filters button{background:transparent;border:0;border-radius:6px;padding:6px 8px;color:#777;font-size:11px}.filters .on{background:#eaeaea;color:#222}.items{overflow:auto;padding:0 9px 18px;flex:1}.row{display:block;width:100%;border:0;border-radius:8px;background:transparent;text-align:left;padding:12px;margin:2px 0}.row:hover{background:#efefef}.row.selected{background:#eaeaea}.row .title{display:block;font-size:12px;font-weight:500;white-space:normal;line-height:1.5}.row .meta{display:flex;align-items:center;gap:5px;font-size:10px;color:#888;margin-top:5px}.dot{width:5px;height:5px;border-radius:100%;background:#aaa}.dot.approved{background:#5e8571}.dot.rejected{background:#a79b8b}.aside-foot{padding:17px 21px;border-top:1px solid var(--line);color:#999;font-size:10px;display:flex;gap:7px;align-items:center}.aside-foot svg{width:13px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{height:70px;min-height:70px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.breadcrumb{display:flex;gap:10px;align-items:center;font-size:13px}.breadcrumb span{color:#999}.top-actions{display:flex;align-items:center;gap:16px}.source-count{color:#888;font-size:11px}#refresh{font-size:12px;padding:8px 11px;display:flex;align-items:center;gap:7px}#refresh svg{width:14px}.summary{display:flex;align-items:center;padding:13px 30px;border-bottom:1px solid var(--line);gap:23px;min-height:45px;font-size:11px;color:#888}.summary b{color:#303030;font-weight:550}.summary .sep{width:1px;height:12px;background:var(--line)}.summary .last{margin-left:auto;font-size:10px}.detail{display:flex;flex-direction:column;flex:1;min-height:0}.scroll{padding:25px 30px;overflow:auto;flex:1;min-height:0}.heading{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.kicker{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:1px;margin:0 0 9px}h1{font-size:24px;font-weight:550;line-height:1.3;letter-spacing:-.7px;margin:0 0 10px}.badge{font-size:10px;color:#666;border:1px solid #e1e1e1;border-radius:5px;padding:5px 7px;white-space:nowrap;margin-top:20px}.badge.warning{background:#faf5e9;border-color:#eee4cd;color:#966b1c}p{line-height:1.6;margin:0 0 10px}.reason{font-size:12px;color:#777;max-width:760px;margin:0 0 20px}.evidence{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:10px;padding:16px 17px;min-width:0}.card-label{color:#888;font-size:10px;font-weight:500;display:flex;gap:7px;align-items:center;margin-bottom:13px}.card-label svg{width:14px;height:14px}.card strong{font-size:12px;font-weight:550}.address{color:#68686c;font-size:12px;line-height:1.7;margin-top:5px}.care{font-size:10px;color:#888;margin:10px 0}.source{font-size:10px;color:#777;text-decoration:none;display:inline-flex;gap:5px;align-items:center}.source svg{width:12px;height:12px}.account-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;color:#a0a0a0;margin-top:10px}.parent{font-size:10px;color:#888;line-height:1.6;margin-top:10px}.billing-line{display:flex;gap:18px;border-top:1px solid var(--line);padding-top:11px;margin-top:11px;font-size:10px;color:#999}.billing-line b{font-weight:500;color:#555;margin-left:5px}.safeguard{margin:15px 0 0;padding:12px 14px;border-radius:8px;border:1px solid #eee4cd;background:#fcf9f1;font-size:11px;color:#7b6b45;line-height:1.7}.section-title{display:flex;align-items:center;justify-content:space-between;margin:23px 0 10px}h2{font-size:12px;font-weight:550;margin:0}.section-title span{font-size:10px;color:#999}.changes{border:1px solid var(--line);border-radius:9px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th{text-align:left;color:#999;font-weight:400;padding:10px 12px;background:#fafafa}th:first-child{width:24%}td{padding:10px 12px;vertical-align:top;border-top:1px solid var(--line);overflow-wrap:anywhere;line-height:1.6}td:first-child{color:#888}td.before{color:#999}.no-write{border:1px solid var(--line);padding:14px 16px;border-radius:8px;color:#777;font-size:11px;margin-top:16px;line-height:1.6}details{margin-top:16px;font-size:11px;color:#888}summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}summary:before{content:'›';font-size:17px;color:#aaa}details[open] summary:before{transform:rotate(90deg)}.candidate{padding:12px 0;border-bottom:1px solid var(--line);font-size:11px}.candidate strong{color:#555;font-weight:500}.candidate p{margin-top:5px;font-size:10px}.decision{padding:16px 30px 18px;border-top:1px solid var(--line);background:white;flex:none}.decision-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.decision label{font-size:11px;color:#777}.reviewer{color:#999;font-size:10px}.reviewer input{border:0;background:transparent;padding:2px;font-size:10px;color:#777;width:130px;text-align:right}.decision textarea{display:block;width:100%;height:50px;resize:vertical;border:1px solid #e3e3e3;border-radius:8px;padding:10px 12px;font-size:11px;line-height:1.6}.decision textarea::placeholder{color:#aaa}.decision-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.hint{font-size:10px;color:#999;display:flex;align-items:center;gap:6px}.hint svg{width:12px;height:12px}.buttons{display:flex;gap:8px}.buttons button{font-size:11px;padding:9px 14px}.primary{background:#212121;color:white;border-color:#212121}.primary:hover{background:#383838}.decision-result{display:flex;align-items:center;justify-content:space-between;gap:14px}.decision-result strong{font-size:12px;font-weight:550}.decision-result p{font-size:11px;color:#888;margin:6px 0 0}.decision-result button{font-size:11px}.live{margin-top:18px;border:1px solid var(--line);border-radius:9px;padding:16px;background:#fafafa}.live pre{font:10px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0}.empty{max-width:420px;margin:15vh auto;text-align:center}.empty svg{width:32px;height:32px;color:#aaa;margin-bottom:18px}.empty h1{font-size:22px}.empty p{font-size:12px;color:#888}.notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#272727;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 4px 20px #0002;font-size:12px;z-index:5;max-width:700px}@media(min-width:1450px){.scroll{padding:32px 6%}.decision{padding-left:6%;padding-right:6%}}@media(max-width:900px){.app{grid-template-columns:238px minmax(0,1fr)}.source-count,.summary .last{display:none}.topbar,.summary{padding-left:22px;padding-right:22px}.scroll{padding:22px}.decision{padding:14px 22px}.evidence{gap:10px}.card{padding:13px}h1{font-size:21px}.badge{margin-top:14px}.summary{gap:13px}.hint{max-width:160px;line-height:1.5}}@media(max-width:640px){.app{grid-template-columns:185px minmax(0,1fr)}.brand{padding-left:15px;font-size:15px}.workspace{display:none}.evidence{grid-template-columns:1fr}.topbar{padding:0 16px}.summary{gap:8px;padding:10px 16px;font-size:9px}.scroll{padding:18px 16px}.decision{padding:14px 16px}.hint{display:none}.decision-bottom{justify-content:flex-end}.breadcrumb{font-size:11px}.row{padding:10px}.row .title{font-size:11px}.filters button{font-size:10px;padding:5px}.queue-head{padding:12px}.heading{display:block}.badge{display:inline-block;margin:0 0 12px}}
</style></head><body>
<div class="app"><aside><div class="brand"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="22" height="22" rx="8"/><path d="M10 8v12h5a3 3 0 000-6h-5m0 0h4a3 3 0 000-6h-4"/></svg>Bellhaven<span class="workspace">Workspace</span></div><div class="queue-head"><div class="queue-title">Review queue <span class="count" id="queue-count">0</span></div><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" placeholder="Search locations" aria-label="Search locations"></div><div class="filters"><button data-filter="pending" class="on">Pending</button><button data-filter="approved">Approved</button><button data-filter="rejected">Rejected</button><button data-filter="all">All</button></div></div><div class="items" id="list"></div><div class="aside-foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Local workspace · Approval required</div></aside>
<section class="main"><div class="topbar"><div class="breadcrumb"><span>Ownership</span><span>/</span>Review</div><div class="top-actions"><span class="source-count" id="source-count"></span><button id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 11a8 8 0 10-2.4 6M20 4v7h-7"/></svg>Run check</button></div></div><div class="summary" id="stats"></div><div class="detail" id="detail"></div></section></div><div id="toast" class="notice" hidden role="status"></div>
<script>
const csrf='__CSRF__';let data,selected,filter='pending';const labels={create:'New account',update:'Account correction',chow:'Change of ownership',duplicate:'Duplicate',duplicate_review:'Needs investigation',not_listed:'No longer listed',ambiguous:'Conflicting evidence'};
const icon={web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>',crm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 17 17 7M7 7h10v10"/></svg>',lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'};
const escape=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const fieldNames={name:'Account name',parent_id:'Parent account',billing_street:'Street address',billing_city:'City',billing_state:'State',billing_zip:'ZIP code',care_type:'Care offerings',status:'Status',note:'Note',duplicate_of_account:'Duplicate of',chow_current_account:'Old account → current'};
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-CSRF':csrf},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
function toast(text){document.querySelector('#toast').textContent=text;document.querySelector('#toast').hidden=false;setTimeout(()=>document.querySelector('#toast').hidden=true,6500)}async function load(){data=await api('/api/review');render()}
function render(){const s=data.summary,count=status=>data.proposals.filter(p=>p.status===status).length;document.querySelector('#queue-count').textContent=count('pending');document.querySelector('#source-count').textContent=`${s.total_locations||0} locations · ${s.crm_accounts||0} accounts`;document.querySelector('#stats').innerHTML=`<span><b>${count('pending')}</b> pending</span><span class="sep"></span><span><b>${count('approved')}</b> approved</span><span><b>${count('rejected')}</b> rejected</span><span class="last">Changes are verified after every approval</span>`;const query=document.querySelector('#search').value.toLowerCase();const rows=data.proposals.filter(p=>(filter==='all'||p.status===filter)&&((p.body.location?.name||p.body.account?.name||'').toLowerCase().includes(query)));if(!rows.some(p=>p.id===selected))selected=rows[0]?.id;document.querySelector('#list').innerHTML=rows.map(p=>`<button class="row ${p.id===selected?'selected':''}" data-id="${p.id}"><span class="title">${escape(p.body.location?.name||p.body.account?.name)}</span><span class="meta"><i class="dot ${p.status}"></i>${escape(labels[p.body.kind])}</span></button>`).join('')||'<p style="padding:12px;color:#999;font-size:12px">No matching proposals</p>';document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});show(rows.find(p=>p.id===selected))}
function displayValue(key,value,p,after){if(key==='parent_id')return value?(after?'Bellhaven Senior Living':p.account?.parent_name||value):'Unassigned';return value||'—'}
function show(row){const box=document.querySelector('#detail');if(!row){box.innerHTML=`<div class="scroll"><div class="empty">${icon.check}<h1>You're all caught up</h1><p>Every decision is saved. Run a check to confirm that your review queue stays clear.</p><p>Approved and rejected proposals remain in your history.</p></div></div>`;return}const p=row.body,a=p.account,l=p.location;let changes=Object.entries(p.desired);if(p.kind==='chow')changes=[...changes,['chow_current_account','New current account ID']];box.innerHTML=`<div class="scroll" id="evidence-scroll"><div class="heading"><div><p class="kicker">${p.kind==='chow'?'Preserve billing history':'Review proposal'}</p><h1>${escape(l?.name||a?.name)}</h1></div><span class="badge ${['chow','ambiguous','not_listed'].includes(p.kind)?'warning':''}">${escape(labels[p.kind])}</span></div><p class="reason">${escape(p.reason)}</p><div class="evidence"><div class="card"><div class="card-label">${icon.web}Website evidence</div>${l?`<strong>${escape(l.name)}</strong><div class="address">${escape(l.street)}<br>${escape(l.city)}, ${escape(l.state)} ${escape(l.zip)}</div><p class="care">${l.care_offerings.map(escape).join(' · ')}</p><a class="source" href="${escape(l.source_url)}" target="_blank" rel="noreferrer">View source ${icon.arrow}</a>`:'<strong>Not found on website</strong><div class="address">The complete directory and homepage were checked. A missing listing does not confirm a sale or closure.</div>'}</div><div class="card"><div class="card-label">${icon.crm}Current CRM record</div>${a?`<strong>${escape(a.name)}</strong><div class="address">${escape(a.billing_street)}<br>${escape(a.billing_city)}, ${escape(a.billing_state)} ${escape(a.billing_zip)}</div><div class="parent">${escape(a.parent_name||'No parent account')}</div><div class="billing-line"><span>Revenue<b>${money(a.lifetime_revenue)}</b></span><span>Open AR<b>${money(a.outstanding_ar)}</b></span></div><div class="account-id">${escape(a.account_id)}</div>`:'<strong>No matching account</strong><div class="address">No location-backed match was found across the full CRM snapshot.</div><div class="parent">A new account will be created only after approval.</div>'}</div></div>${p.kind==='chow'?'<div class="safeguard"><strong>Billing protection</strong> · Revenue history and unpaid AR are both present. Keep the old account and its parent unchanged. Create a new current account under Bellhaven, then set only the old account’s CHOW pointer.</div>':''}${changes.length?`<div class="section-title"><h2>${p.kind==='chow'?'New account & old-account link':'Proposed changes'}</h2><span>${changes.length} field${changes.length===1?'':'s'} · ${p.kind==='create'?'Create':p.kind==='chow'?'Create + link':'Update'}</span></div><div class="changes"><table><thead><tr><th>Field</th><th>${p.kind==='chow'?'Old account (preserved)':'Current value'}</th><th>${p.kind==='chow'?'New account / link':'After approval'}</th></tr></thead><tbody>${changes.map(([k,v])=>`<tr><td>${escape(fieldNames[k]||k)}</td><td class="before">${escape(p.kind==='create'?'—':displayValue(k,a?.[k],p,false))}</td><td>${escape(displayValue(k,v,p,true))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="no-write">The names agree, but the locations do not. This proposed association is blocked from writing to the CRM.</div>'}${p.candidates?.length?`<details><summary>Compare ${p.candidates.length} candidate${p.candidates.length>1?'s':''}</summary>${p.candidates.map(c=>`<div class="candidate"><strong>${escape(c.account.name)}</strong> · ${c.score}/100<p>${escape(c.account.billing_street)}, ${escape(c.account.billing_city)}, ${escape(c.account.billing_state)} ${escape(c.account.billing_zip)}<br>${escape(c.reason)}<br>${escape(c.account.account_id)}</p></div>`).join('')}</details>`:''}${row.result?'<div id="live"></div>':''}</div>${row.status==='pending'?`<div class="decision"><div class="decision-row"><label for="reason">Decision note</label><div class="reviewer"><input id="reviewer" aria-label="Reviewer" value="${escape(sessionStorage.getItem('reviewer')||'Submission reviewer')}"></div></div><textarea id="reason" aria-label="Decision note" placeholder="Add a reason for approving or rejecting this proposal…"></textarea><div class="decision-bottom"><span class="hint">${icon.lock}Nothing writes without approval</span><div class="buttons"><button id="reject">Reject</button><button id="approve" class="primary" ${p.kind==='ambiguous'?'disabled':''}>Approve change</button></div></div></div>`:`<div class="decision"><div class="decision-result"><div><strong>${row.status==='approved'?'Approved · CRM verified':row.status==='rejected'?'Rejected · CRM unchanged':escape(row.status)}</strong><p>${escape(row.decision_note)}</p><p>${escape(row.reviewer)} · ${escape(row.decision_at)}</p></div>${row.result?'<button id="show-live">Verify live record ↗</button>':''}</div></div>`}`;for(const action of ['approve','reject']){const button=document.querySelector('#'+action);if(button)button.onclick=async()=>{const reviewer=document.querySelector('#reviewer').value,note=document.querySelector('#reason').value;if(!note.trim())return toast('Add a decision note first.');sessionStorage.setItem('reviewer',reviewer);document.querySelectorAll('.buttons button').forEach(b=>b.disabled=true);try{await api('/api/decide',{id:p.id,action,reviewer,note});toast(action==='approve'?'Approved. Change verified in CRM.':'Rejected. CRM unchanged.');await load()}catch(e){toast(e.message);show(row)}}}const live=document.querySelector('#show-live');if(live)live.onclick=async()=>{try{const record=await api('/api/account/'+row.result.account_id);document.querySelector('#live').innerHTML='<div class="live"><h2>Live CRM record</h2><p style="font-size:10px;color:#999;margin-top:6px">Fresh response from the CRM API</p><pre>'+escape(JSON.stringify(record,null,2))+'</pre></div>';document.querySelector('#live').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){toast(e.message)}}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelector('#search').oninput=render;document.querySelector('#refresh').onclick=async()=>{const b=document.querySelector('#refresh');b.disabled=true;const old=b.innerHTML;b.textContent='Checking…';try{const s=await api('/api/run',{});toast(`${s.total_locations} locations checked · ${s.new_proposals} new proposals`);await load()}catch(e){toast(e.message)}finally{b.disabled=false;b.innerHTML=old}};load().catch(e=>toast(e.message));
</script></body></html>
